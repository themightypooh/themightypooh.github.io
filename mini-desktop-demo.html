<!doctype html>
<html lang="en">
<head>

<title>mini desktop — demo</title>
<link rel="stylesheet" href="mini-desktop.css?v=11">
</head>
<body>
<div class="md-wrap">
  <div class="md-head">
    <h1>A desktop, my way</h1>

  <p class="md-info" id="md-info"></p>
